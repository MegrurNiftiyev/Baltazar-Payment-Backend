openapi: 3.0.0
info:
  title: Payment Gateway Simulator API
  version: 1.0.0
  description: Production-like card payment gateway simulator API (tokenize, charge, reference lookup, balance reset).
servers:
  - url: http://localhost:3001
    description: Local development server
tags:
  - name: Payment Methods
    description: Card tokenization endpoints
  - name: Charges
    description: Payment authorization and charge processing
  - name: Reference Data
    description: Test card lookup and balance reset utilities

paths:
  /api/payments/methods:
    post:
      summary: Tokenize a payment card
      description: Converts raw card credentials into a reusable paymentMethodId token.
      tags:
        - Payment Methods
      parameters:
        - in: header
          name: Accept-Language
          schema:
            type: string
            enum: [en, az, ru]
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenizeRequest'
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '400':
          description: Validation or card status error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Card not found in data store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/charges:
    post:
      summary: Charge a tokenized payment method
      description: Charges a payment method token.
      tags:
        - Charges
      parameters:
        - in: header
          name: Accept-Language
          schema:
            type: string
            enum: [en, az, ru]
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '200':
          description: Transaction completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeSuccessResponse'
        '400':
          description: Invalid amount or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'
        '402':
          description: Insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'
        '403':
          description: Card blocked or declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'
        '404':
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'
        '504':
          description: Simulated random network timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeErrorResponse'

  /api/payments/test-cards:
    get:
      summary: List reference test cards
      tags:
        - Reference Data
      responses:
        '200':
          description: List of 50 synthetic test cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCardsResponse'


  /api/payments/test-cards/reset-all:
    post:
      summary: Reset all test cards to seed values
      description: Restores every test card's balance and state to its original seed data in one call.
      tags:
        - Reference Data
      responses:
        '200':
          description: All cards reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  resetCount:
                    type: integer
                    example: 50
                  message:
                    type: string
                    example: All test card balances restored to seed values


components:
  schemas:
    TokenizeRequest:
      type: object
      required: [cardNumber, cardHolder, expiryMonth, expiryYear, cvv]
      properties:
        cardNumber: { type: string, example: "4539974024498311" }
        cardHolder: { type: string, example: "DAVID MORENO" }
        expiryMonth: { type: string, example: "11" }
        expiryYear: { type: string, example: "2028" }
        cvv: { type: string, example: "417" }
    TokenizeResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        paymentMethodId: { type: string, example: "pm_7f3ab21c9e" }
        brand: { type: string, example: "VISA" }
        last4: { type: string, example: "8311" }
        expiryMonth: { type: string, example: "11" }
        expiryYear: { type: string, example: "2028" }

    ChargeRequest:
      type: object
      required: [paymentMethodId, amount]
      properties:
        paymentMethodId: { type: string, example: "pm_7f3ab21c9e" }
        amount: { type: number, example: 45.50 }
        currency: { type: string, default: "AZN", example: "AZN" }
    ChargeSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        transactionId: { type: string, example: "txn_c92f1a08e4" }
        status: { type: string, example: "SUCCESS" }
        amount: { type: number, example: 45.50 }
        currency: { type: string, default: "AZN", example: "AZN" }
        processedAt: { type: string, format: date-time }
    ChargeErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        errorCode: { type: string, example: "INSUFFICIENT_FUNDS" }
        message: { type: string, example: "Insufficient funds on the card" }
        transactionId: { type: string, example: "txn_c92f1a08e5" }
        status: { type: string, example: "FAILED" }
        processedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        errorCode: { type: string, example: "CARD_EXPIRED" }
        message: { type: string, example: "This card has expired" }
    CardReference:
      type: object
      properties:
        cardNumber: { type: string, example: "4539974024498311" }
        paymentMethodId: { type: string, example: "pm_7f3ab21c9e" }
        cardHolder: { type: string, example: "DAVID MORENO" }
        brand: { type: string, example: "VISA" }
        last4: { type: string, example: "8311" }
        expiryMonth: { type: string, example: "11" }
        expiryYear: { type: string, example: "2028" }
        balance: { type: number, example: 842.30 }
        currency: { type: string, default: "AZN", example: "AZN" }
        status: { type: string, example: "ACTIVE" }
        forcedResult: { type: string, nullable: true, example: null }
    TestCardsResponse:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardReference'
